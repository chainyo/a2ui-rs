[workspace]
members = ["crates/a2ui-rs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/chainyo/a2ui-rs"

[workspace.dependencies]
a2ui-rs = { path = "crates/a2ui-rs" }
boon = { version = "0.6.1", default-features = false }
fancy-regex = { version = "0.20.2", default-features = false, features = ["std"] }
fixed_decimal = { version = "0.7", features = ["ryu"] }
icu_calendar = { version = "2.4", default-features = false }
icu_datetime = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_decimal = "2.4"
icu_experimental = "0.7"
icu_locale_core = "2.4"
icu_plurals = "2.4"
icu_provider = "2.4"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
unicode-ident = "1.0.27"
url = "2.5.9"
thiserror = "2.0.21"
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }
writeable = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
