version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    assignees:
      - chainyo
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - chainyo
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    assignees:
      - chainyo
    commit-message:
      prefix: chore
      include: scope
