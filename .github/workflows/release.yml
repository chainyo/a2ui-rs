name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/package-validation.yml

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install locked tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.6
          install_args: --locked
          cache_key_prefix: mise-${{ hashFiles('rust-toolchain.toml') }}
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(mise exec -- cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "a2ui-rs") | .version')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'The release tag must be v%s.\n' "$version" >&2
            exit 1
          fi
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            printf '%s\n' 'Set the CARGO_REGISTRY_TOKEN GitHub Actions secret.' >&2
            exit 1
          fi
          mise exec -- cargo publish --package a2ui-rs --registry crates-io --all-features --locked
