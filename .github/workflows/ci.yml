name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          version: 1.7.12
      - name: Lint shell scripts
        run: |
          bash -n scripts/install-hawk.sh
          shellcheck scripts/install-hawk.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check targets
        run: cargo xtask-check
      - name: Clippy
        run: cargo xtask-clippy
      - name: Test
        run: cargo xtask-test
      - name: Test documentation
        run: cargo test --workspace --doc --locked
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Verify upstream references and report pending cases
        run: |
          cargo xtask upstream > target/upstream-report.txt
          tail -n 1 target/upstream-report.txt
      - name: Install Hawk
        run: ./scripts/install-hawk.sh
      - name: Hawk
        run: cargo hawk check --manifest-path Cargo.toml --target-dir target/hawk --exclude-crate a2ui_core -D warnings -D hawk::unnecessary_crate_visibility
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check
          arguments: --locked
          rust-version: 1.97.1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.97.1
      - run: cargo xtask-test
      - run: cargo test --workspace --doc --locked
      - run: cargo xtask upstream
