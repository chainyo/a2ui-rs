name: package validation

on:
  push:
    tags: ["v*"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-package-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install locked tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.6
          install_args: --locked
          cache_key_prefix: mise-${{ hashFiles('rust-toolchain.toml') }}
      - name: Test workspace and require Core conformance
        run: mise run test-release
  processor-scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install locked tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.6
          install_args: --locked
          cache_key_prefix: mise-${{ hashFiles('rust-toolchain.toml') }}
      - name: Measure processor scaling
        run: mise run timing
