min_version = "2026.11.6"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile_platforms = ["linux-x64", "macos-x64", "macos-arm64", "windows-x64"]

[tools]
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"github:mongodb/kingfisher" = "1.110.0"
"github:astral-sh/hawk" = { version = "0.1.9", os = ["linux", "macos"], matching = "cargo-hawk" }

[tasks.check]
description = "Run formatting, lint, build, and dependency checks"
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "actionlint",
  "cargo fmt --all -- --check",
  "cargo check --workspace --all-targets --no-default-features --locked",
  "cargo check-all",
  "cargo clippy-all",
  "cargo doc --workspace --all-features --no-deps --locked",
  "cargo deny --locked check",
]

[tasks.test]
description = "Run integration and documentation tests"
run = [
  "cargo test-all",
  "cargo test --workspace --all-features --doc --locked",
]

[tasks.test-release]
description = "Run workspace tests and require v1.0 Core conformance coverage"
env = { A2UI_REQUIRE_CORE_CONFORMANCE = "1" }
run = "mise run test"

[tasks.timing]
description = "Measure message processor scaling with pinned upstream cases"
run = "cargo test --release --package a2ui-rs --features basic-catalog --test upstream --locked upstream_processor_scaling -- --ignored --nocapture"
